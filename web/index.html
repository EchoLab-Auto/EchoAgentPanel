<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：竖屏移动端安全区（刘海 / Home 指示条）随
         env(safe-area-inset-*) 生效（2026-10 移动端适配）。 -->
    <!-- interactive-widget=resizes-content（2026-11）：告诉支持它的浏览器
         「软键盘弹出时压缩**布局视口**」而不是只压视觉视口。
         Chrome 108+ 支持；Safari 目前忽略（无害）。支持时 innerHeight
         会跟着变小 —— 整个高度链（--app-h → #app → .chat-view）自动变矮，
         输入区 bottom 本来就贴容器底，不需要任何 JS 抬升，也就没有
         「JS 抬升 + Safari 自己滚」双算的问题。不支持时退回 ChatView 的
         visualViewport 闭环，见 ChatView.vue。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>EchoAgent Panel</title>
    <!-- PWA / 头显独立应用运行（XR 巨幕模式）：manifest + 图标 + 主题色。
         maskable 图标供 Android 系（PICO 等）桌面/窗口自适应裁切。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS「添加到主屏幕」独立应用：旧 iOS 只认 apple-mobile-web-app-capable
         （不读 manifest.display），缺它时从主屏打开仍带 Safari 地址栏。
         status-bar-style 保持 default：black-translucent 会让状态栏文字恒为
         白色，亮色主题的浅灰顶栏上不可读。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#e0e0e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)" />
    <script>
      // 防主题闪烁：显式 light 不设 data-theme；dark 或未保存/auto 时跟随系统偏好。
      !(function () {
        try {
          var t = localStorage.getItem('echo-panel-theme');
          if (t === 'light') return;
          if (
            t === 'dark' ||
            ((t === null || t === 'auto') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* 首屏加载骨架（2026-10 慢网络加载优化）：
         纯内联（样式 + DOM，不依赖任何外链资源与 JS），在慢网络下
         JS/CSS 尚在传输时（实测 1.5Mbps 冷启动 ~2.4s）立即给出视觉
         反馈——此前 #app 为空，用户面对纯白屏。Vue 挂载时自动清空
         #app 内容，骨架随之被替换。 */
      html, body { height: 100%; margin: 0; }
      body { background: #e0e0e0; }
      html[data-theme='dark'] body { background: #1c1c1c; }
      .boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        color: #666;
        user-select: none; -webkit-user-select: none;
      }
      html[data-theme='dark'] .boot { color: #9a9a9a; }
      .boot__ring {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.12); border-top-color: #0969da;
        animation: boot-spin 0.9s linear infinite;
      }
      html[data-theme='dark'] .boot__ring {
        border-color: rgba(255, 255, 255, 0.14); border-top-color: #4c9aff;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot__slow { font-size: 12px; opacity: 0; animation: boot-reveal 0.4s ease 8s forwards; }
      @keyframes boot-reveal { to { opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) {
        .boot__ring { animation-duration: 2.4s; }
      }
    </style>
    <script>
      // 视口高度兜底（2026-10）：--app-h = 实测 window.innerHeight（px），
      // 供 styles.css 移动段高度链消费（var(--app-h, 100dvh)）。
      // 修复：个别浏览器 dvh 不可靠（iOS 非滚动页不动态更新 / 老 WebView
      // 不支持 dvh）时高度会偏大 ~浏览器工具条高，底部输入区被工具条遮挡。
      // innerHeight 在主流移动浏览器均为「排除浏览器工具条的可见高度」，
      // 且键盘弹出不改变它（键盘偏移由 visualViewport 逻辑处理，互不干扰）。
      !(function () {
        var doc = document.documentElement;
        function setAppHeight() {
          var h = window.innerHeight;
          if (h > 0) {
            // 键盘打开时**不更新**基准（2026-11 修复，用户报「输入区跑到
            // 屏幕最上方」）。iOS / 部分 Android WebView 在键盘弹出瞬间会让
            // innerHeight 短暂变小一次，而这个函数是裸挂在 window.resize 上
            // 的；一旦把 508 写进 --app-h，键盘收起后不会再有 resize 事件把它
            // 改回 844 —— 界面永久矮一截。与此同时 ChatView 的键盘抬升仍按
            // 真实 innerHeight（844）算出 336px，两者叠加就把输入区顶到顶部。
            // 判据：可视视口明显小于布局视口 = 键盘在我们下面。
            // 对 resizes-content 的浏览器（innerHeight 与 vv 同步变矮）差值≈0，
            // 仍会正常更新 —— 那条路径本来就该缩。
            if (
              window.visualViewport &&
              window.innerHeight - window.visualViewport.height > 80
            ) {
              return;
            }
            doc.style.setProperty('--app-h', h + 'px');
          }
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
        window.addEventListener('pageshow', setAppHeight);
        // 个别浏览器地址栏收展只发 visualViewport.resize：键盘关闭时才同步
        // （键盘打开时 vv.height 会骤减，此处不介入、保持 --app-h 不变）
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            if (window.visualViewport.height >= window.innerHeight - 80) setAppHeight();
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-hidden="true">
        <div class="boot__ring"></div>
        <div>正在加载 EchoAgent Panel…</div>
        <div class="boot__slow">网络较慢，仍在努力加载…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
