[workspace]
resolver = "2"
members = ["source/echo-web-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/EchoLab-Auto/EchoAgentPanel"

# Faster test builds (cheap to compile, noticeably faster test runs).
[profile.test]
opt-level = 1

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"

# 静态资源 gzip 协商（echo-web-server 静态路由）
flate2 = "1"

# http / ws server
axum = { version = "0.8", features = ["ws"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# config
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# test-only HTTP client（媒体路由集成测试）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
