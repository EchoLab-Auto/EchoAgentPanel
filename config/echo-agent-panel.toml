# EchoAgentPanel 配置
# 复制为 config/echo-agent-panel.local.toml 后按需修改。

[server]
# 反向 WebSocket 监听地址，NapCat 将作为客户端连接到这里。
bind_address = "0.0.0.0:3131"
# 与 NapCat「网络配置 → WebSocket 客户端」中配置的 Token 保持一致。
# 留空表示不开启鉴权。也可通过环境变量 ECHO_ACCESS_TOKEN 覆盖。
access_token = ""
# 心跳探测间隔（秒），0 表示禁用探测。
heartbeat_interval = 30

[logging]
level = "info"    # trace | debug | info | warn | error
format = "text"   # text | json
# 日志文件路径。留空 = 自动：TUI 模式写 logs/echo-agent-panel.log（stdout 被界面占用），
# headless 模式写 stdout（Docker 中可用 docker logs 查看）。
log_file = ""

[bot]
# 允许执行管理员命令（status/shutdown）的 QQ 号，0 表示禁用管理员命令。
owner_qq = 0
# 命令前缀。
command_prefix = "/"

[agent]
# ⚠️ API 配置默认为空。
# 推荐在 TUI 中配置：/api（或 Ctrl+X s / Ctrl+P → 配置 API），
# 支持多配置存储与一键切换，保存后自动持久化到本文件。
# 也可直接填写（支持 [[agent.api_profiles]] 多配置 + active_api 指定激活项）。
provider = ""
model = ""
# 留空用 provider 默认端点（openai→api.openai.com、deepseek→api.deepseek.com、
# anthropic→api.anthropic.com、ollama→localhost:11434）。
# 注意：若 base_url 以 /anthropic 结尾（如 DeepSeek 的 https://api.deepseek.com/anthropic），
# 自动按 Anthropic Messages 格式请求，无需改 provider。
base_url = ""
api_key = ""
dm_auto_reply = true
group_at_reply = true
max_tool_iterations = 5
memory_limit = 40
skills_dir = "skills"
system_prompt = "你是一个友好、乐于助人的 QQ 助手。回答简洁清晰，使用中文。"
[tui]
# 是否启动终端 UI（--headless 可强制关闭）
enabled = true
# dark | light
theme = "dark"
