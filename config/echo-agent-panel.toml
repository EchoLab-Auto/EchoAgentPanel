# EchoAgentPanel 配置 — Web 面板（Rust 后端 + Vue 3 前端）
# 复制为 config/echo-agent-panel.local.toml 后按需修改。
# Core（Agent 核心服务）的配置在 EchoAgentCore 仓库的 config/echo-agent-core.toml。

[logging]
level = "info"    # trace | debug | info | warn | error
format = "text"   # text | json
log_file = ""
max_file_size_mb = 20
max_files = 5

[server]
# HTTP/WS 监听地址。默认 0.0.0.0 允许局域网/外部访问；仅本机访问改为 127.0.0.1:8080。
bind_address = "0.0.0.0:8080"
# 构建后的前端静态目录（默认相对当前工作目录；安装器会写入绝对路径）。
static_dir = "web/dist"
# 媒体库目录（Core 落盘的入站图片；/media/<id> 从这里读）。
# 留空 = ~/.local/share/echo-agent-core/media（与 Core 缺省一致）。
media_dir = ""

[core]
# EchoAgentCore management WebSocket 地址（与 Core 的 [core] management_address 对应）。
connect_url = "ws://127.0.0.1:3132"
# 必须与 Core [core].management_access_token 一致；留空表示不发送认证头。
access_token = ""

# ── 多上游（聚合视图，2026-10）──
# 本节可完全省略：设置·Core 连接页支持**在线增删**上游并自动写回本段
# （tmp+rename 原子写，其余段原样保留）。零上游部署时本段留空即可，
# Panel 启动后在界面里添加。注意：本段一旦被在线管理写过（哪怕清空），
# 上面 [core] 段的单上游兜底即失效（以在线管理为准）。
# 配置任意多条 [[cores]] 后，浏览器单连接同时中继到全部上游：
# 事件按来源加壳 {core, frame}，会话列表按来源着色/徽标区分；
# 命令默认发往当前选中会话所属的上游。单上游（[core] 或一条 [[cores]]）
# 为无壳直发路径。
# [[cores]]
# name = "a"
# url = "ws://192.168.1.10:3132"
# access_token = ""
#
# [[cores]]
# name = "b"
# url = "ws://192.168.1.20:3132"
# access_token = ""
