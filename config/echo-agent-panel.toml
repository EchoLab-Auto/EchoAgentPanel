# EchoAgentPanel 配置 — Panel（终端 UI）
# 复制为 config/echo-agent-panel.local.toml 后按需修改。
# Core（Agent 核心服务）的配置在 EchoAgentCore 仓库的 config/echo-agent-core.toml。

[logging]
level = "info"    # trace | debug | info | warn | error
format = "text"   # text | json
# 日志文件路径。留空 = 自动：TUI 模式写 logs/echo-agent-panel.log（stdout 被界面占用）。
log_file = ""
max_file_size_mb = 20
max_files = 5

[tui]
# 是否启动终端 UI。
enabled = true
# dark | light
theme = "dark"

[core]
# 远程 Core 的 management WebSocket 地址（--connect 可覆盖）。
connect_url = "ws://127.0.0.1:3132"
