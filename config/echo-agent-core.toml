# EchoAgentPanel 配置 — Core（Agent 核心）
# 复制为 config/echo-agent-core.local.toml 后按需修改。
# Panel 的配置见 config/echo-agent-panel.toml。

[logging]
level = "info"    # trace | debug | info | warn | error
format = "text"   # text | json
# 日志文件路径。留空 = stdout（Docker 中可用 docker logs 查看）。
log_file = ""

[agent]
# DeepSeek（默认）。支持多配置存储与一键切换（Panel 的 /api 命令），保存后由 Core 持久化到本文件。
provider = "deepseek"
model = "deepseek-v4-flash"
# DeepSeek Anthropic 兼容端点
base_url = "https://api.deepseek.com/anthropic"
api_key = ""
max_tool_iterations = 1024
memory_limit = 40
skills_dir = "skills"
system_prompt = "请你使用中文"

[adapters.qq]
# 是否启用 QQ 适配器（启动时自动连接 NapCat）。
enabled = false
# NapCat OneBot HTTP API，用于读取完整群和好友列表。
napcat_onebot_url = "http://localhost:3000"
# 允许执行管理员命令（status/shutdown）的 QQ 号，0 表示禁用管理员命令。
owner_qq = 0
# 命令前缀。
command_prefix = "/"

[adapters.qq.server]
# 反向 WebSocket 监听地址，NapCat 将作为客户端连接到这里。
bind_address = "0.0.0.0:3131"
# 与 NapCat「网络配置 → WebSocket 客户端」中配置的 Token 保持一致。
# 留空表示不开启鉴权。也可通过环境变量 ECHO_ACCESS_TOKEN 覆盖。
access_token = ""
# 心跳探测间隔（秒），0 表示禁用探测。
heartbeat_interval = 30

[adapters.qq.trigger]
dm_auto_reply = true
group_at_reply = true

[core]
# Panel 连接用的 management WebSocket 监听地址。
management_address = "127.0.0.1:3132"
